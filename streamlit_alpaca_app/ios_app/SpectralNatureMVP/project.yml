name: SpectralNature
options:
  minimumXcodeGenVersion: 2.38.0
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "9"
targets:
  SpectralNature:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SpectralNatureMVP
    info:
      path: SpectralNatureMVP/Info.plist
      properties:
        CFBundleDisplayName: Spectral Nature
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.torrescapital.spectralnature.account
            CFBundleURLSchemes:
              - spectralnature
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.torrescapital.spectralnature
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 44J3R74SJ9
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  SpectralNature:
    build:
      targets:
        SpectralNature: all
    run:
      config: Debug
    archive:
      config: Release
